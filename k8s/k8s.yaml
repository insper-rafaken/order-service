# ─── ConfigMap ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
data:
  DATABASE_HOST: "order-db"
  DATABASE_PORT: "5432"
  DATABASE_DB: "order"
  DATABASE_USERNAME: "order"
  RABBITMQ_HOST: "rabbitmq"
  REDIS_HOST: "redis"
  PRODUCT_URL: "http://product:8080"
  EXCHANGE_URL: "http://exchange:8080"
---
# ─── PersistentVolumeClaim ──────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 5Gi
---
# ─── PostgreSQL 16 Deployment ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
  labels:
    app: order-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "order"
            - name: POSTGRES_USER
              value: "order"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_PASSWORD_ORDER
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
          volumeMounts:
            - name: order-db-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: order-db-data
          persistentVolumeClaim:
            claimName: order-db-pvc
---
# ─── PostgreSQL 16 Service ──────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: order-db
spec:
  selector:
    app: order-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# ─── Order Deployment ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: rafaelken/order:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: order-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_PASSWORD_ORDER
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
---
# ─── Order Service ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  selector:
    app: order
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
